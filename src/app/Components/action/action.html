<!-- =========================================
   EDITORIAL ACTION / CTA SECTION (VCASS STYLE)
   ========================================= -->
<section class="action-section" id="action-cta">

  <!-- GOLDEN ROSETTE WATERMARK EMBLEM (Top Center) -->


  <div class="action-stage">

    <!-- MAIN DISPLAY HEADLINE -->
    <div class="action-heading-wrap">
      <h2 class="action-main-title">
        <span class="title-primary">JOIN OUR LIGHT COMPREHENSIVE COLLEGE LEARNING COMMUNITY</span>
      </h2>

      <!-- DESKTOP CURVED ARROW (Spans from under the 'L' to the button) -->
      <svg class="editorial-arrow-desktop" viewBox="0 0 160 120" fill="none" xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true">
        <!-- Smooth curved trajectory swooping down and left -->
        <path d="M 148,4 C 152,48 105,108 24,96" stroke="#161616" stroke-width="1.4" stroke-linecap="round"
          fill="none" />
        <!-- Arrowhead tip pointing to the bottom corner of button -->
        <path d="M 32,90 L 22,96 L 31,103" stroke="#161616" stroke-width="1.4" stroke-linecap="round"
          stroke-linejoin="round" fill="none" />
      </svg>
    </div>

    <!-- TILTED BADGE BUTTON -->
    <div class="action-button-anchor">
      <a href="contact" class="compass-login-badge" id="btn-compass-login"
        aria-label="Compass Student and Parent Login">
        <span class="badge-text">GET STARTED TODAY</span>
        <span class="badge-blue-square">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round">
            <line x1="7" y1="17" x2="17" y2="7"></line>
            <polyline points="7 7 17 7 17 17"></polyline>
          </svg>
        </span>
      </a>
    </div>



  </div>

</section>
