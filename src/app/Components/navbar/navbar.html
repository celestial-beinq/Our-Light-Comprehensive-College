<header class="app-nav-header">
  <div class="nav-holder" [class.scrolled]="isScrolled">
    <div class="nav-wrapper" [class.scrolled]="isScrolled">
      <nav class="jbc-nav">
        <a routerLink="/home" class="brand text-decoration-none">
          <img src="images/logo.PNG" alt="OLCC Logo" class="brand-logo" onerror="this.style.display='none'">
          OLCC
        </a>

        <!-- DESKTOP NAV LINKS -->
        <ul class="nav-links desktop-links">
          <li><a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a></li>
          <li><a routerLink="/about" routerLinkActive="active">About</a></li>
          <li><a routerLink="/academics" routerLinkActive="active">Academics</a></li>
          <li><a routerLink="/gallery" routerLinkActive="active">Gallery</a></li>
          <li><a href="https://www.schoolcard.com.ng" target="_blank" rel="noopener noreferrer">School Portal</a></li>
        </ul>

        <!-- HAMBURGER TOGGLE (mobile only) -->
        <button class="nav-toggle" [class.active]="menuOpen" (click)="toggleMenu()" aria-label="Toggle navigation">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
      </nav>

      <a routerLink="/contact" class="btn-get-started desktop-btn text-decoration-none">Contact Us</a>
    </div>
  </div>

  <!-- MOBILE SIDE DRAWER -->
  <div class="mobile-backdrop" [class.visible]="menuOpen" (click)="toggleMenu()"></div>
  <div class="mobile-drawer" [class.open]="menuOpen">
    <div class="drawer-header">
      <div class="drawer-brand">
        <img src="images/logo.png" alt="OLCC Logo" class="drawer-logo" onerror="this.style.display='none'">
        OLCC
      </div>
      <button class="drawer-close" (click)="toggleMenu()" aria-label="Close menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="drawer-body">
      <ul class="drawer-links">
        <li><a routerLink="/home" (click)="menuOpen = false"><i class="bi bi-house-door"></i> Home</a></li>
        <li><a routerLink="/about" (click)="menuOpen = false"><i class="bi bi-info-circle"></i> About</a></li>
        <li><a routerLink="/academics" (click)="menuOpen = false"><i class="bi bi-book"></i> Academics</a></li>
        <li><a routerLink="/gallery" (click)="menuOpen = false"><i class="bi bi-images"></i> Gallery</a></li>
        <li><a href="https://www.schoolcard.com.ng" target="_blank" rel="noopener noreferrer" (click)="menuOpen = false"><i class="bi bi-box-arrow-up-right"></i> School Portal</a></li>
      </ul>
    </div>
    <div class="drawer-footer">
      <a routerLink="/contact" class="drawer-cta" (click)="menuOpen = false">Contact Us</a>
    </div>
  </div>
</header>
